<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>JARVIS — Remote</title>

    <style>

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07090f;
            --panel: rgba(255,255,255,0.045);
            --panel2: rgba(255,255,255,0.025);
            --border: rgba(255,255,255,0.09);

            --accent: #6366f1;
            --accent-dim: rgba(99,102,241,0.16);

            --text: #dde3ed;
            --muted: #6b7688;

            --green: #4ade80;
            --red: #f87171;
            --yellow: #facc15;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: var(--bg);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
        }

        /* =====================================================
           APP
           ===================================================== */

        .app {
            width: 100%;
            max-width: 760px;
            height: 100%;

            display: flex;
            flex-direction: column;

            background: var(--bg);
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 18px 14px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7,9,15,0.94);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: var(--accent-dim);
            border: 1px solid
                rgba(99,102,241,0.28);

            color: var(--accent);

            font-size: 18px;
            font-weight: 800;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .brand-sub {
            margin-top: 2px;

            font-size: 9px;
            color: var(--muted);

            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 10px;
            color: var(--muted);
        }

        .dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--red);
        }

        .dot.connected {
            background: var(--green);
            box-shadow:
                0 0 8px
                rgba(74,222,128,0.5);
        }

        /* =====================================================
           STATUS
           ===================================================== */

        .status-bar {
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 18px;

            background: var(--panel2);

            border-bottom:
                1px solid var(--border);

            font-size: 10px;
            color: var(--muted);
        }

        .status-value {
            color: var(--text);
        }

        /* =====================================================
           LOG
           ===================================================== */

        .feed {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 18px;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feed::-webkit-scrollbar {
            width: 4px;
        }

        .feed::-webkit-scrollbar-thumb {
            background:
                rgba(255,255,255,0.1);

            border-radius: 10px;
        }

        .empty {
            margin: auto;

            text-align: center;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.7;
        }

        .empty strong {
            display: block;

            margin-bottom: 6px;

            color: var(--text);

            font-size: 14px;
        }

        .message {
            display: flex;
            flex-direction: column;

            max-width: 92%;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.jarvis {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message.system {
            align-self: center;
            align-items: center;

            max-width: 100%;
        }

        .speaker {
            margin-bottom: 4px;

            font-size: 8px;
            color: var(--muted);

            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .bubble {
            padding: 10px 13px;

            border-radius: 13px;

            background: var(--panel);

            border: 1px solid var(--border);

            font-size: 12px;
            line-height: 1.5;

            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: var(--accent-dim);

            border-color:
                rgba(99,102,241,0.28);
        }

        .message.system .bubble {
            background: transparent;

            border-color: transparent;

            color: var(--muted);

            font-size: 10px;
        }

        /* =====================================================
           CONTROL PANEL
           ===================================================== */

        .controls {
            flex: 0 0 auto;

            padding: 12px 18px 18px;

            border-top:
                1px solid var(--border);

            background:
                rgba(7,9,15,0.97);
        }

        .command-row {
            display: flex;
            gap: 8px;
        }

        .command-input {
            flex: 1;

            min-width: 0;

            padding: 13px 14px;

            border-radius: 12px;

            border: 1px solid var(--border);

            outline: none;

            background:
                rgba(255,255,255,0.045);

            color: var(--text);

            font-size: 12px;
        }

        .command-input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px
                rgba(99,102,241,0.1);
        }

        .command-input::placeholder {
            color: var(--muted);
        }

        button {
            border: none;
            outline: none;

            cursor: pointer;

            font-family: inherit;
        }

        .send-btn {
            width: 48px;

            border-radius: 12px;

            background: var(--accent);

            color: white;

            font-size: 17px;
        }

        .send-btn:active {
            transform: scale(0.96);
        }

        .quick-row {
            display: flex;
            gap: 7px;

            margin-top: 9px;

            overflow-x: auto;
        }

        .quick-row::-webkit-scrollbar {
            display: none;
        }

        .quick {
            flex: 0 0 auto;

            padding: 7px 10px;

            border-radius: 8px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid var(--border);

            color: var(--muted);

            font-size: 9px;
        }

        .quick:active {
            background: var(--accent-dim);
            color: var(--text);
        }

        /* =====================================================
           ACTION BUTTONS
           ===================================================== */

        .action-row {
            display: flex;
            gap: 8px;

            margin-top: 9px;
        }

        .action {
            flex: 1;

            padding: 9px;

            border-radius: 9px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid var(--border);

            color: var(--muted);

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .action:hover {
            color: var(--text);
        }

        .action.live {
            color: var(--accent);

            border-color:
                rgba(99,102,241,0.25);

            background:
                var(--accent-dim);
        }

        .action.danger {
            color: var(--red);
        }

        /* =====================================================
           AUDIO
           ===================================================== */

        .audio-state {
            display: none;

            margin-top: 8px;

            padding: 8px;

            text-align: center;

            border-radius: 9px;

            background:
                rgba(99,102,241,0.08);

            border:
                1px solid
                rgba(99,102,241,0.18);

            color: var(--accent);

            font-size: 9px;
            letter-spacing: 1px;
        }

        .audio-state.active {
            display: block;
        }

        /* =====================================================
           FILE INPUT
           ===================================================== */

        #fileInput {
            display: none;
        }

    </style>

</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="brand">

            <div class="brand-mark">
                J
            </div>

            <div>

                <div class="brand-name">
                    JARVIS
                </div>

                <div class="brand-sub">
                    Remote Control
                </div>

            </div>

        </div>

        <div class="connection">

            <span
                class="dot"
                id="connectionDot"
            ></span>

            <span id="connectionText">
                Connecting
            </span>

        </div>

    </header>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div class="status-bar">

        <span>
            STATUS
        </span>

        <span
            class="status-value"
            id="statusValue"

        </span>

    <!-- =====================================================
         FEED
         ===================================================== -->

    <main
        class="feed"
        id="feed"

        <div
            class="empty"

            <strong>
                JARVIS Remote

            Connected to your JARVIS PRO system.

            Send a command below.

        </div>

    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <section class="controls">

        <div class="command-row">

            <input
                id="commandInput"

                type="text"
                autocomplete="off"

            <button

                id="sendButton"

                ➤
            </button>

        </div>


        <!-- =================================================
             QUICK COMMANDS
             ================================================= -->

        <div class="quick-row">

            <button
                class="quick"
                data-command="hey jarvis"
            >
                Wake
            </button>

            <button
                class="quick"
                data-command="what time is it"
            >
                Time

            <button
                class="quick"

            >
                YouTube
            </button>

            <button
                class="quick"
                data-command="open google"
            >
                Google
            </button>

            <button
                class="quick"
                data-command="turn on the light"
            >
                Light ON
            </button>

            <button
                class="quick"
                data-command="turn off the light"
            >
                Light OFF
            </button>

        </div>


        <!-- =================================================
             ACTIONS
             ================================================= -->

        <div class="action-row">

            <button
                class="action live"
                id="wakeButton"
                type="button"
            >
                Wake
            </button>

            <button
                class="action"
                id="micButton"

                Microphone

            <button

            >

                Stop Live

        </div>


        <div

        </div>

        <input

    </section>

</div>


<!-- =========================================================
     CRYPTOJS
     ========================================================= -->

<script src="/static/crypto-js.min.js"></script>


<script>

/*
=============================================================
JARVIS PRO REMOTE CLIENT
=============================================================
*/


// ============================================================
// STATE
// ============================================================

const token =
    sessionStorage.getItem(
        "jarvis_token"
    );

const sessionKey =
    sessionStorage.getItem(
        "jarvis_key"
    );


if (!token || !sessionKey) {

    location.replace(
        "/login"
    );

}


// ============================================================
// DOM
// ============================================================

const feed =
    document.getElementById(
        "feed"
    );

const empty =
    document.getElementById(
        "empty"
    );

const input =
    document.getElementById(
        "commandInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const statusValue =
    document.getElementById(
        "statusValue"
    );

const wakeButton =
    document.getElementById(
        "wakeButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const uploadButton =
    document.getElementById(
        "uploadButton"
    );

const stopLiveButton =
    document.getElementById(
        "stopLiveButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const audioState =
    document.getElementById(
        "audioState"
    );


// ============================================================
// WEBSOCKET
// ============================================================

let ws = null;

let reconnectTimer = null;

let manuallyClosed = false;


function websocketUrl() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    return (
        protocol
        + "//"
        + location.host
        + "/ws?token="
        + encodeURIComponent(
            token
        )
    );

}


function connectWebSocket() {

    if (
        manuallyClosed
    ) {
        return;
    }


    setConnection(
        false,
        "Connecting"
    );


    try {

        ws = new WebSocket(
            websocketUrl()
        );

    } catch (error) {

        scheduleReconnect();

        return;

    }


    ws.onopen = function () {

        setConnection(
            true,
            "Connected"
        );

        statusValue.textContent =
            "Remote connection active.";

    };


    ws.onmessage = function (
        event
    ) {

        try {

            const message =
                JSON.parse(
                    event.data
                );

            handleMessage(
                message
            );

        } catch (error) {

            console.log(
                "WebSocket message:",
                event.data
            );

        }

    };


    ws.onclose = function () {

        setConnection(
            false,
            "Disconnected"
        );

        statusValue.textContent =
            "Connection lost. Reconnecting...";

        scheduleReconnect();

    };


    ws.onerror = function () {

        setConnection(
            false,
            "Connection error"
        );

    };

}


function scheduleReconnect() {

    if (
        reconnectTimer
        || manuallyClosed
    ) {
        return;
    }

    reconnectTimer =
        setTimeout(
            function () {

                reconnectTimer = null;

                connectWebSocket();

            },
            2000
        );

}


// ============================================================
// CONNECTION UI
// ============================================================

function setConnection(
    connected,
    text
) {

    connectionText.textContent =
        text;

    if (connected) {

        connectionDot.classList.add(
            "connected"
        );

    } else {

        connectionDot.classList.remove(
            "connected"
        );

    }

}


// ============================================================
// MESSAGE HANDLER
// ============================================================

function handleMessage(
    message
) {

    const type =
        message.type;


    if (
        type === "log"
    ) {

        addMessage(
            message.speaker || "jarvis",
            message.text || ""
        );

        return;

    }


    if (
        type === "sys"
    ) {

        addMessage(
            "system",
            message.text || ""
        );

        statusValue.textContent =
            message.text || "System event.";

        return;

    }


    if (
        type === "status"
    ) {

        statusValue.textContent =
            message.state
                ? "JARVIS: "
                  + message.state
                : "JARVIS online.";

        return;

    }


    if (
        type === "wake"
    ) {

        addMessage(
            "system",
            "JARVIS wake requested."
        );

        return;

    }


    if (
        type === "file_received"
    ) {

        const name =
            message.name ||
            "file";

        addMessage(
            "system",
            "File received: "
            + name
        );

        return;

    }

}


// ============================================================
// FEED MESSAGE
// ============================================================

function addMessage(
    speaker,
    text
) {

    if (!text) {
        return;
    }


    if (empty) {

        empty.remove();

    }


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message "
        + (
            speaker === "user"
                ? "user"
                : speaker === "system"
                    ? "system"
                    : "jarvis"
        );


    const label =
        document.createElement(
            "div"
        );

    label.className =
        "speaker";


    if (
        speaker === "user"
    ) {

        label.textContent =
            "YOU";

    } else if (
        speaker === "system"
    ) {

        label.textContent =
            "SYSTEM";

    } else {

        label.textContent =
            "JARVIS";

    }


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    wrapper.appendChild(
        label
    );

    wrapper.appendChild(
        bubble
    );


    feed.appendChild(
        wrapper
    );


    feed.scrollTop =
        feed.scrollHeight;

}


// ============================================================
// AES ENCRYPTION
// ============================================================

function encryptCommand(
    text
) {

    if (
        typeof CryptoJS ===
        "undefined"
    ) {

        throw new Error(
            "CryptoJS is not loaded."
        );

    }


    /*
     * JARVIS PRO server derives:
     *
     * SHA256(
     *     sessionKey
     *     + "JARVIS-DASHBOARD-v1"
     * )
     */

    const key =
        CryptoJS.SHA256(
            sessionKey
            + "JARVIS-DASHBOARD-v1"
        );


    const iv =
        CryptoJS.lib.WordArray.random(
            16
        );


    const encrypted =
        CryptoJS.AES.encrypt(
            text,
            key,
            {
                iv: iv,

                mode:
                    CryptoJS.mode.CBC,

                padding:
                    CryptoJS.pad.Pkcs7
            }
        );


    /*
     * Server expects:
     *
     * IV + ciphertext
     */

    const combined =
        iv
        .concat(
            encrypted.ciphertext
        );


    return CryptoJS.enc.Base64.stringify(
        combined
    );

}


// ============================================================
// SEND COMMAND
// ============================================================

async function sendCommand(
    command
) {

    const text =
        String(
            command || ""
        ).trim();


    if (!text) {
        return;
    }


    addMessage(
        "user",
        text
    );


    input.value = "";


    try {

        const encrypted =
            encryptCommand(
                text
            );


        const response =
            await fetch(
                "/api/command",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer "
                            + token
                    },

                    body: JSON.stringify({
                        enc: encrypted
                    })
                }
            );


        let data;

        try {

            data =
                await response.json();

        } catch {

            data = {};

        }


        if (
            !response.ok
            || !data.ok
        ) {

            addMessage(
                "system",
                data.error
                    || "Command failed."
            );

        }

    } catch (error) {

        addMessage(
            "system",
            "Unable to send command: "
            + error.message
        );

    }

}


// ============================================================
// SEND BUTTON
// ============================================================

sendButton.addEventListener(
    "click",
    function () {

        sendCommand(
            input.value
        );

    }
);


// ============================================================
// ENTER
// ============================================================

input.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendCommand(
                input.value
            );

        }

    }
);


// ============================================================
// QUICK COMMANDS
// ============================================================

document
    .querySelectorAll(
        ".quick"
    )
    .forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    sendCommand(
                        button.dataset.command
                    );

                }
            );

        }
    );


// ============================================================
// WAKE
// ============================================================

wakeButton.addEventListener(
    "click",
    async function () {

        try {

            const response =
                await fetch(
                    "/api/wake",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                "Bearer "
                                + token
                        }
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
                || !data.ok
            ) {

                addMessage(
                    "system",
                    data.error
                        || "Wake failed."
                );

            }

        } catch (error) {

            addMessage(
                "system",
                "Wake request failed."
            );

        }

    }
);


// ============================================================
// STOP LIVE
// ============================================================

stopLiveButton.addEventListener(
    "click",
    async function () {

        try {

            const response =
                await fetch(
                    "/api/live/stop",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                "Bearer "
                                + token
                        }
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
                || !data.ok
            ) {

                addMessage(
                    "system",
                    data.error
                        || "Unable to stop Live Conversation."
                );

            }

        } catch (error) {

            addMessage(
                "system",
                "Live stop request failed."
            );

        }

    }
);


// ============================================================
// FILE UPLOAD
// ============================================================

uploadButton.addEventListener(
    "click",
    function () {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    async function () {

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }


        const form =
            new FormData();

        form.append(
            "file",
            file
        );


        addMessage(
            "system",
            "Uploading "
            + file.name
            + "..."
        );


        try {

            const response =
                await fetch(
                    "/api/upload",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                "Bearer "
                                + token
                        },

                        body: form
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
                || !data.ok
            ) {

                addMessage(
                    "system",
                    data.error
                        || "Upload failed."
                );

            } else {

                addMessage(
                    "system",
                    "Upload complete: "
                    + (
                        data.name
                        || file.name
                    )
                );

            }

        } catch (error) {

            addMessage(
                "system",
                "Upload failed."
            );

        }


        fileInput.value = "";

    }
);


// ============================================================
// PHONE MICROPHONE
// ============================================================

let audioSocket = null;

let audioContext = null;

let mediaStream = null;

let processor = null;


micButton.addEventListener(
    "click",
    async function () {

        if (
            audioSocket
            && audioSocket.readyState
                === WebSocket.OPEN
        ) {

            stopPhoneMicrophone();

        } else {

            startPhoneMicrophone();

        }

    }
);


async function startPhoneMicrophone() {

    try {

        mediaStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });


        const protocol =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";


        audioSocket =
            new WebSocket(
                protocol
                + "//"
                + location.host
                + "/ws/phone-audio?token="
                + encodeURIComponent(
                    token
                )
            );


        audioSocket.binaryType =
            "arraybuffer";


        audioSocket.onopen =
            async function () {

                audioState.classList.add(
                    "active"
                );

                micButton.textContent =
                    "Stop Mic";


                /*
                 * Use a 16 kHz mono audio path
                 * where supported.
                 */

                audioContext =
                    new (
                        window.AudioContext
                        || window.webkitAudioContext
                    )({
                        sampleRate: 16000
                    });


                const source =
                    audioContext
                        .createMediaStreamSource(
                            mediaStream
                        );


                processor =
                    audioContext
                        .createScriptProcessor(
                            4096,
                            1,
                            1
                        );


                processor.onaudioprocess =
                    function (event) {

                        if (
                            !audioSocket
                            || audioSocket.readyState
                                !== WebSocket.OPEN
                        ) {
                            return;
                        }


                        const inputData =
                            event.inputBuffer
                                .getChannelData(
                                    0
                                );


                        const pcm =
                            convertFloat32ToPCM16(
                                inputData
                            );


                        audioSocket.send(
                            pcm.buffer
                        );

                    };


                source.connect(
                    processor
                );

                processor.connect(
                    audioContext.destination
                );

            };


        audioSocket.onclose =
            function () {

                stopPhoneMicrophone(
                    false
                );

            };


        audioSocket.onerror =
            function () {

                addMessage(
                    "system",
                    "Phone microphone connection error."
                );

                stopPhoneMicrophone(
                    false
                );

            };

    } catch (error) {

        addMessage(
            "system",
            "Microphone access failed: "
            + error.message
        );

    }

}


function stopPhoneMicrophone(
    closeSocket = true
) {

    if (
        processor
    ) {

        try {
            processor.disconnect();
        } catch {}

        processor = null;

    }


    if (
        audioContext
    ) {

        try {
            audioContext.close();
        } catch {}

        audioContext = null;

    }


    if (
        mediaStream
    ) {

        mediaStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        mediaStream = null;

    }


    if (
        closeSocket
        && audioSocket
    ) {

        try {
            audioSocket.close();
        } catch {}

    }


    audioSocket = null;


    audioState.classList.remove(
        "active"
    );

    micButton.textContent =
        "Microphone";

}


function convertFloat32ToPCM16(
    input
) {

    const output =
        new Int16Array(
            input.length
        );


    for (
        let i = 0;
        i < input.length;
        i++
    ) {

        const sample =
            Math.max(
                -1,
                Math.min(
                    1,
                    input[i]
                )
            );


        output[i] =
            sample < 0
                ? sample * 0x8000
                : sample * 0x7fff;

    }


    return output;

}


// ============================================================
// PAGE START
// ============================================================

connectWebSocket();

input.focus();


/*
 * Prevent the phone from accidentally leaving
 * the dashboard while an audio socket is active.
 */

window.addEventListener(
    "beforeunload",
    function () {

        manuallyClosed = true;

        stopPhoneMicrophone();

    }
);

</script>
